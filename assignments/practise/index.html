<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Form Local Storage</title>
</head>
<body>
    <h2>User Details Form</h2>
    <form id="userForm">
        <label>Name:</label><br>
        <input type="text" id="name" name="name" required><br><br>
        
        <label>Email:</label><br>
        <input type="email" id="email" name="email" required><br><br>
        
        <button type="submit">Save to Local Storage</button>
    </form>

    <script>
        // 1. Get the form element
        const form = document.getElementById('userForm');

        form.addEventListener('submit', function(event) {
            // 2. Prevent form from refreshing the page
            event.preventDefault();

            // 3. Collect form data
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;

            // 4. Create an object
            const userDetails = {
                name: name,
                email: email
            };

            // 5. Save to local storage (convert object to string)
            localStorage.setItem('userData', JSON.stringify(userDetails));
            
            alert('Data saved! Check Application tab in DevTools.');
        });
    </script>
</body>
</html>
